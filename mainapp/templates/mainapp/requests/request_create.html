{% extends 'mainapp/base.html' %}
{% block title %}Новая заявка{% endblock %}


{% block content %}

<div class="container">
    <div class="mt-5">
        <h1>Новая заявка</h1>
        <div class="mt-5">
            <form method="post" enctype="multipart/form-data">{% csrf_token %}

                {{ form.as_p }}

                <button class="btn btn-primary" type="submit">
                    Создать
                </button>

            </form>
        </div>
    </div>
</div>


{% endblock %}
