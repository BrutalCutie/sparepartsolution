<div style="overflow-y: auto; height: 20rem;">
    <ul class="list-group">

        {% for chat in chats %}
        <li class="list-group-item {% if request.resolver_match.kwargs.pk == chat.pk %}active{% endif %}">

            <a class="nav-link" href="{% url 'mainapp:chat-detail' chat.pk %}">
                <h3 class="fw-light">{% if chat.pk in unreaded %}🔴{% endif %}{{ chat.request.car }} {{ chat.request.model }} {{ chat.request.year}}</h3>
            </a>
        </li>
        {% endfor %}
    </ul>

</div>
