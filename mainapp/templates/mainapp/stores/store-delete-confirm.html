{% extends 'mainapp/base.html' %}

{% block title %}Подтвердите удаление своего магазина{% endblock %}

{% block content %}

<div class="container">
    <div class="mt-5">
        <h1>Желаете удалить {{store.name}}?</h1>

        <form method="post">
            {% csrf_token %}
            <button class="btn btn-danger" type="submit">Удалить</button>
            <a href="{% url 'mainapp:my-requests-list' %}" class="btn btn-primary">Назад</a>
        </form>
    </div>

</div>


{% endblock %}
